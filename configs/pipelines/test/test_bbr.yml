exp_name: "'@{dataset.name}'_'@{network.name}'_'@{pipeline.name}'_τ'@{evaluator.evaluator_args.tau}'_n'@{evaluator.evaluator_args.grid_pts}'_'@{mark}'/s'@{seed}'"
output_dir: ./results/
save_output: True
merge_option: default # disabled if 'save_output' is False
mark: default # to mark the version of experiment
seed: 0

num_gpus: 1
num_workers: 4
num_machines: 1
machine_rank: 0

network:
  pretrained: True

pipeline:
  name: test_bbr

evaluator:
  name: bbr
  evaluator_args:
    tau: 0.1
    temperature: 1
    grid_pts: 201
    top_n: 100
    intra_classpair_reduction: min